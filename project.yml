# Definicja projektu Xcode (XcodeGen). Po zmianie: `make generate`.
name: Bifold
options:
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Brand.xcconfig
  Release: Config/Brand.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  BifoldKit:
    path: Packages/BifoldKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1
  # Automatyczne aktualizacje.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Bifold:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Helper/local.aoles.bifold.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Bifold.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/ThirdParty/build
        # Ostrzeżenie z nagłówka HexFiend (HFFunctions.h, kod zewnętrzny) przy imporcie modułu.
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -Wno-implicit-const-int-float-conversion
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: BifoldKit
        product: BifoldCore
      - package: BifoldKit
        product: BifoldWorkspace
      - package: BifoldKit
        product: BifoldAgent
      - package: BifoldKit
        product: BifoldBridgeKit
      - target: bifold-mcp
        embed: true
        copy:
          destination: executables
      - target: bifold-helper
        embed: true
        copy:
          destination: executables
      - package: BifoldKit
        product: BifoldHelperKit
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
      - framework: ThirdParty/build/HexFiend.framework
        embed: true
        codeSign: true
    preBuildScripts:
      # Kroki ze zdefiniowanymi wejściami i wyjściami — Xcode uruchamia je tylko, gdy coś się zmieniło.
      - name: HexFiend.framework
        script: "\"$SRCROOT/scripts/build-hexfiend.sh\""
        inputFiles:
          - $(SRCROOT)/scripts/build-hexfiend.sh
        outputFiles:
          - $(SRCROOT)/ThirdParty/build/HexFiend.framework/HexFiend
      - name: bifold-mtp
        script: "\"$SRCROOT/scripts/build-mtp-helper.sh\""
        inputFiles:
          - $(SRCROOT)/Tools/bifold-mtp/bifold-mtp.c
          - $(SRCROOT)/scripts/build-mtp-helper.sh
        outputFiles:
          - $(SRCROOT)/ThirdParty/build/bifold-mtp
    postBuildScripts:
      # Wejściem jest źródło, nie zbudowany pomocnik — bez libmtp pomocnika nie ma, a brak pliku
      # wejściowego byłby błędem budowania.
      - name: Wbuduj bifold-mtp
        script: "\"$SRCROOT/scripts/embed-mtp-helper.sh\""
        inputFiles:
          - $(SRCROOT)/Tools/bifold-mtp/bifold-mtp.c
          - $(SRCROOT)/scripts/embed-mtp-helper.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/bifold-mtp
  bifold-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Packages/BifoldKit/Sources/bifold-mcp
    settings:
      base:
        PRODUCT_NAME: bifold-mcp
    dependencies:
      - package: BifoldKit
        product: BifoldBridgeKit
  bifold-helper:
    type: tool
    platform: macOS
    sources:
      - path: Packages/BifoldKit/Sources/bifold-helper
    settings:
      base:
        PRODUCT_NAME: bifold-helper
        PRODUCT_BUNDLE_IDENTIFIER: $(BIFOLD_BUNDLE_ID).helper
        INFOPLIST_FILE: App/Helper/Helper-Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
    dependencies:
      - package: BifoldKit
        product: BifoldHelperKit
schemes:
  Bifold:
    build:
      targets:
        Bifold: all
      preActions:
        - name: Wersja z gita
          script: "\"$SRCROOT/scripts/set-version.sh\""
          settingsTarget: Bifold
    run:
      config: Debug
    archive:
      config: Release
