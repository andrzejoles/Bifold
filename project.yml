# Definicja projektu Xcode (XcodeGen). Po zmianie: `make generate`.
name: Bifold
options:
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  groupSortPosition: top
  # Wersja Xcode, dla której projekt jest aktualny (LastUpgradeCheck/LastUpgradeVersion = 2700) — bez tego
  # Xcode 27 proponuje „Update to recommended settings”, a ręczna zmiana i tak znika przy `make generate`.
  xcodeVersion: "27.0"
configFiles:
  Debug: Config/Brand.xcconfig
  Release: Config/Brand.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
    # Zalecane ustawienia Xcode 27 (jak w szablonie nowego projektu).
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    # Świadomie NO: kluczem tekstu jest polskie zdanie (L10n.tr), a pary typu „Nazwa”/„nazwa” czy
    # „Kopiuj”/„Kopiuj…” dają ten sam symbol — generowanie kończy budowanie błędem.
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    # Świadomie NO (Xcode zaleca YES): skrypty budowania wychodzą poza piaskownicę skryptów —
    # build-hexfiend.sh uruchamia xcodebuild i pisze do ThirdParty/build, build-mtp-helper.sh pisze tam
    # bifold-mtp i czyta libmtp z Homebrew, akcja wstępna schematu (set-version.sh) uruchamia git
    # i zapisuje build/Version.xcconfig.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  BifoldKit:
    path: Packages/BifoldKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1
  # Automatyczne aktualizacje.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Bifold:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Bifold.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/ThirdParty/build
        # Ostrzeżenie z nagłówka HexFiend (HFFunctions.h, kod zewnętrzny) przy imporcie modułu.
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -Wno-implicit-const-int-float-conversion
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: BifoldKit
        product: BifoldCore
      - package: BifoldKit
        product: BifoldWorkspace
      - package: BifoldKit
        product: BifoldAgent
      - package: BifoldKit
        product: BifoldBridgeKit
      - target: bifold-mcp
        embed: true
        copy:
          destination: executables
      - target: bifold-helper
        embed: true
        copy:
          destination: executables
      - package: BifoldKit
        product: BifoldHelperKit
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
      - framework: ThirdParty/build/HexFiend.framework
        embed: true
        codeSign: true
    preBuildScripts:
      # Kroki ze zdefiniowanymi wejściami i wyjściami — Xcode uruchamia je tylko, gdy coś się zmieniło.
      - name: HexFiend.framework
        script: "\"$SRCROOT/scripts/build-hexfiend.sh\""
        inputFiles:
          - $(SRCROOT)/scripts/build-hexfiend.sh
        outputFiles:
          - $(SRCROOT)/ThirdParty/build/HexFiend.framework/HexFiend
      # Przy każdym budowaniu (skrypt sam sprawdza daty, także libmtp z Homebrew — po `brew upgrade libmtp`
      # pomocnik musi powstać od nowa, a libmtp nie może być plikiem wejściowym: bez niej byłby błąd).
      - name: bifold-mtp
        basedOnDependencyAnalysis: false
        script: "\"$SRCROOT/scripts/build-mtp-helper.sh\""
        inputFiles:
          - $(SRCROOT)/Tools/bifold-mtp/bifold-mtp.c
          - $(SRCROOT)/scripts/build-mtp-helper.sh
        outputFiles:
          - $(SRCROOT)/ThirdParty/build/bifold-mtp
    postBuildScripts:
      # Przy każdym budowaniu, ale kopiuje tylko nowszego pomocnika (embed-mtp-helper.sh). Zbudowany
      # pomocnik nie może być plikiem wejściowym — bez libmtp go nie ma, a brak pliku byłby błędem.
      - name: Wbuduj bifold-mtp
        basedOnDependencyAnalysis: false
        script: "\"$SRCROOT/scripts/embed-mtp-helper.sh\""
        inputFiles:
          - $(SRCROOT)/Tools/bifold-mtp/bifold-mtp.c
          - $(SRCROOT)/scripts/embed-mtp-helper.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/bifold-mtp
      # Plik demona pomocnika (SMAppService) z identyfikatorów w Config/Brand.xcconfig — bundle id nie
      # jest wpisany nigdzie indziej. Etykieta = usługa Mach = $(BIFOLD_BUNDLE_ID).helper.
      - name: Plik demona pomocnika
        script: |
          set -euo pipefail
          DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          LABEL="$BIFOLD_BUNDLE_ID.helper"
          PLIST="$DIR/$LABEL.plist"
          mkdir -p "$DIR"
          rm -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :Label string $LABEL" \
            -c "Add :BundleProgram string Contents/MacOS/bifold-helper" \
            -c "Add :MachServices dict" -c "Add :MachServices:$LABEL bool true" \
            -c "Add :AssociatedBundleIdentifiers array" -c "Add :AssociatedBundleIdentifiers:0 string $BIFOLD_BUNDLE_ID" \
            "$PLIST" >/dev/null
          plutil -convert xml1 "$PLIST"
        inputFiles:
          - $(SRCROOT)/Config/Brand.xcconfig
          - $(SRCROOT)/project.yml
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(BIFOLD_BUNDLE_ID).helper.plist
  bifold-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Packages/BifoldKit/Sources/bifold-mcp
    settings:
      base:
        PRODUCT_NAME: bifold-mcp
    dependencies:
      - package: BifoldKit
        product: BifoldBridgeKit
  bifold-helper:
    type: tool
    platform: macOS
    sources:
      - path: Packages/BifoldKit/Sources/bifold-helper
    settings:
      base:
        PRODUCT_NAME: bifold-helper
        PRODUCT_BUNDLE_IDENTIFIER: $(BIFOLD_BUNDLE_ID).helper
        INFOPLIST_FILE: App/Helper/Helper-Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
    dependencies:
      - package: BifoldKit
        product: BifoldHelperKit
schemes:
  Bifold:
    build:
      targets:
        Bifold: all
      preActions:
        - name: Wersja z gita
          script: "\"$SRCROOT/scripts/set-version.sh\""
          settingsTarget: Bifold
    run:
      config: Debug
    archive:
      config: Release
